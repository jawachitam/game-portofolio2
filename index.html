<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <!-- Meta tag ini PENTING BANGET biar layar HP gak bisa di-zoom/scroll pas main game di IG -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Portofolio Interaktif</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Game akan otomatis masuk ke tag body oleh Kaboom -->

  <!-- UI Tombol D-Pad untuk HP -->
  <div id="dpad">
    <div id="btn-up" class="d-btn">⬆️</div>
    <div id="btn-left" class="d-btn">⬅️</div>
    <div id="btn-down" class="d-btn">⬇️</div>
    <div id="btn-right" class="d-btn">➡️</div>
  </div>

  <!-- Tombol Aksi (Buat interaksi NPC) -->
  <div id="btn-action">A</div>

  <script type="module" src="script.js"></script>
</body>
</html>
